-anchor="start">Puerto 5432</text><text x="1253" y="800" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">EBS cifrado</text><path d="M980 760 L1013 760" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><path d="M1200 760 L1233 760" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><text x="800" y="890" font-family="Arial, sans-serif" font-size="19" fill="#475569" font-weight="normal" text-anchor="start">API y PostgreSQL accesibles solo por sus grupos de seguridad.</text><text x="800" y="922" font-family="Arial, sans-serif" font-size="19" fill="#475569" font-weight="normal" text-anchor="start">Node Exporter en los tres roles; exporter PostgreSQL en la base.</text><text x="55" y="1005" font-family="Arial, sans-serif" font-size="22" fill="#047857" font-weight="normal" text-anchor="start">El navegador usa HTTP del frontend. No llama Terraform ni conecta directamente a PostgreSQL.</text></svg>