<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1460" viewBox="0 0 1300 1460"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#047857"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="35" y="45" font-family="Arial, sans-serif" font-size="28" fill="#047857" font-weight="bold" text-anchor="start">CREACIÓN / DE LA SOLICITUD A LA INSTITUCIÓN ACTIVA</text><rect x="65" y="90" width="690" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="125" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">01 / Formulario</text><text x="83" y="156" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Interesado elige plan, motor, entorno y color.</text><text x="83" y="183" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">POST /api/public/tenant-requests</text><path d="M410 210 L410 245" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="250" width="690" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="285" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">02 / Solicitud PENDING</text><text x="83" y="316" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Prisma guarda la solicitud cifrada.</text><text x="83" y="343" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Todavía no se crea infraestructura.</text><path d="M410 370 L410 405" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="410" width="690" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="445" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">03 / Revisión administrativa</text><text x="83" y="476" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">El rol platform aprueba o rechaza.</text><text x="83" y="503" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Transacción y control de duplicados.</text><path d="M410 530 L410 565" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="570" width="690" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="605" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">04 / Tenant + trabajo QUEUED</text><text x="83" y="636" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">La aprobación guarda ambos registros.</text><text x="83" y="663" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Se borra el secreto de la solicitud revisada.</text><path d="M410 690 L410 725" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="730" width="690" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="765" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">05 / Worker RUNNING</text><text x="83" y="796" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Tick cada 3 s / máximo dos trabajos.</text><text x="83" y="823" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Valida AWS, plan, artefacto y cuota.</text><path d="M410 850 L410 885" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="890" width="690" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="925" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">06 / Motor de infraestructura</text><text x="83" y="956" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Terraform plan/apply o change set AWS.</text><text x="83" y="983" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Estado remoto / revisión de reemplazos.</text><path d="M410 1010 L410 1045" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="1050" width="690" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="1085" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">07 / Tres máquinas y configuración</text><text x="83" y="1116" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Frontend, backend y PostgreSQL.</text><text x="83" y="1143" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">S3 + SSM + cloud-init + bootstrap por rol.</text><path d="M410 1170 L410 1205" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="1210" width="690" height="120" rx="16" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="2"/><text x="83" y="1245" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">08 / Verificación y ACTIVE</text><text x="83" y="1276" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">HTTP de servicios y tres exporters activos.</text><text x="83" y="1303" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Resultado e historial visibles en el panel.</text><rect x="835" y="410" width="400" height="145" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="853" y="445" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">RECHAZAR</text><text x="853" y="476" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Motivo e historial.</text><text x="853" y="503" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Sin trabajo ni nuevas VMs.</text><path d="M755 470 L832 470" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="900" width="400" height="175" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="853" y="935" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">SI FALLA</text><text x="853" y="966" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Trabajo FAILED y error redactado.</text><text x="853" y="993" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Corregir causa y reintentar.</text><text x="853" y="1020" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Se reutilizan identidad y estado.</text><path d="M755 950 L832 950" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="1410" font-family="Arial, sans-serif" font-size="22" fill="#047857" font-weight="normal" text-anchor="start">El frontend consulta el progreso. Aprobar no espera que termine la instalación en AWS.</text></svg>