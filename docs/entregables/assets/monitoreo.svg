<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#047857"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="35" y="45" font-family="Arial, sans-serif" font-size="28" fill="#047857" font-weight="bold" text-anchor="start">OBSERVABILIDAD / PRODUCIR, RECOGER, EVALUAR Y MOSTRAR</text><rect x="60" y="110" width="390" height="120" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="78" y="145" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">Node Exporter</text><text x="78" y="176" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Tres roles / CPU y memoria</text><text x="78" y="203" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Puerto 9100</text><path d="M255 230 L715 350" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="110" width="390" height="120" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="538" y="145" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">API académica</text><text x="538" y="176" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">/api/metrics / errores y latencia</text><text x="538" y="203" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Conectividad PostgreSQL</text><path d="M715 230 L715 350" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="110" width="390" height="120" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="998" y="145" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">PostgreSQL Exporter</text><text x="998" y="176" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">pg_up / estadísticas de base</text><text x="998" y="203" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Puerto 9187</text><path d="M1175 230 L715 350" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="355" width="470" height="150" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="498" y="390" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">Prometheus / frontend del tenant</text><text x="498" y="421" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Recoge endpoints cada 10 s.</text><text x="498" y="448" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Evalúa reglas cada 10 s.</text><text x="498" y="475" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Series etiquetadas por tenant / entorno / rol.</text><rect x="120" y="650" width="480" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="138" y="685" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">Grafana / dashboard del tenant</text><text x="138" y="716" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Consulta PromQL y presenta paneles.</text><text x="138" y="743" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">No registra asistencias ni crea EC2.</text><rect x="840" y="650" width="480" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="858" y="685" font-family="Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">Backend del plano de control</text><text x="858" y="716" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Consulta métricas y alertas por HTTP.</text><text x="858" y="743" font-family="Arial, sans-serif" font-size="20" fill="#475569" font-weight="normal" text-anchor="start">Conserva resumen y eventos en PostgreSQL.</text><path d="M600 505 L365 645" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="580" font-family="Arial, sans-serif" font-size="18" fill="#047857" font-weight="normal" text-anchor="middle">Consulta</text><path d="M830 505 L1080 645" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><text x="1060" y="580" font-family="Arial, sans-serif" font-size="18" fill="#047857" font-weight="normal" text-anchor="middle">Consulta</text><text x="60" y="840" font-family="Arial, sans-serif" font-size="23" fill="#047857" font-weight="normal" text-anchor="start">Las flechas representan flujo de información; Prometheus inicia los scrapes (pull).</text></svg>